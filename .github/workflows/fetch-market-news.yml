name: Actualizar noticias de mercado

on:
  schedule:
    # Cada 6 horas. Usa solo fuentes RSS públicas (BCE, Fed, Google News):
    # no requiere ninguna clave ni cuenta.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Obtener noticias de mercado
        env:
          DEBUG_RSS: 'true'
        run: node scripts/fetch-market-news.mjs

      - name: Guardar el resumen de noticias en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-news.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias, no se crea commit."
          else
            git commit -m "Actualizar noticias de mercado"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
